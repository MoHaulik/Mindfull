<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <title>Bevidst Vejrtrækning XR — NXT/Care</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body { margin:0; overflow:hidden; background:#0a0a0a; font-family:'Segoe UI',system-ui,sans-serif; }
    #overlay {
      position:absolute; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; z-index:10;
      background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%);
    }
    h1 { color:#fff; font-weight:300; margin-bottom:40px; text-shadow:0 4px 20px rgba(100,210,255,0.5); }
    #start-button {
      padding:20px 40px; font-size:28px; color:#fff; border:none; border-radius:50px;
      background: linear-gradient(135deg,#182848 0%,#4b6cb7 100%);
      box-shadow:0 10px 30px rgba(0,0,0,0.5); cursor:pointer; transition:.3s;
      text-transform:uppercase; letter-spacing:2px;
    }
    #start-button:hover { background: linear-gradient(135deg,#233a66 0%,#5d81d6 100%); transform:translateY(-2px); }
    .hint { color:#9bb; margin-top:24px; font-size:14px; letter-spacing:1px; opacity:.7; }
    .webxr-hidden { display:none !important; }
    #diag {
      position:fixed; left:8px; bottom:8px; z-index:9999; max-width:90vw;
      font:12px/1.4 -apple-system,Menlo,monospace; color:#9be7c4;
      background:rgba(0,0,0,.55); padding:6px 10px; border-radius:8px;
      pointer-events:none; white-space:pre-wrap;
    }
  </style>
  <!-- HLS.js — Quest browser is Chromium and has no native HLS -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="overlay">
    <h1>Bevidst Vejrtrækning</h1>
    <button id="start-button">Start session</button>
    <div class="hint">Klap hænderne sammen i 6 sek. for at afslutte</div>
  </div>
  <div id="diag">video: idle</div>

<script type="module">
import * as THREE from 'three';

// ─── CONFIG (NXT/Care v1.3) ─────────────────────────────────────────────────
const INTRO_DURATION     = 60;
const BREATHING_DURATION = 360;
const CLAP_DIST          = 0.15;
const CLAP_TIME          = 6000;
const VIDEO_URL          = 'baggrund.m3u8';

const state = {
  xrSession:null, isPlaying:false,
  clock:new THREE.Clock(), elapsedTime:0, phase:'INTRO',
  lastCameraPos:new THREE.Vector3(), timeSinceLastMove:10.0,
  baseEnvOpacity:0.0, currentEnvOpacity:0.0,
  clapStart:0, layersConfigured:false,
  lastVideoPlayAttempt: 0 
};

let camera, scene, renderer;
let leftSphere, rightSphere, leftMat, rightMat;
let videoEl, videoTex, hlsInstance;
let orbGroup, orbMesh, orbLight, uiMesh, uiCtx, uiTex;
let clapHUD;
const controllers = [];
let audioListener, oceanSound;
let currentTitle = "", currentInstruction = "";
let networkErrorCount = 0;

const diagEl = document.getElementById('diag');
function diag(msg) { if (diagEl) diagEl.textContent = msg; console.log('[diag]', msg); }

// ─── INIT ───────────────────────────────────────────────────────────────────
function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 200);
  camera.layers.enable(1); 
  scene.add(camera);

  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x000000, 0); 
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  setupLighting();
  setupVideoBackground();
  setupOrb();
  setupClapHUD();
  setupControllers();
  setupAudio();

  document.getElementById('start-button').addEventListener('click', onStartClick);
  addEventListener('resize', onResize);
}

function onStartClick() {
  if (audioListener && audioListener.context.state === 'suspended') audioListener.context.resume();
  if (oceanSound && oceanSound.buffer && !oceanSound.isPlaying) {
    try { oceanSound.play(); diag('audio: playing'); } catch(e) { console.warn(e); }
  }
  if (videoEl) {
    const p = videoEl.play();
    if (p && p.then) p.then(()=>diag('video: playing')).catch(err=>diag('video play() rejected: '+err.message));
  }
  startXR();
}

function setupLighting() {
  scene.add(new THREE.AmbientLight(0xffffff, 1.6));
  const key = new THREE.DirectionalLight(0xffffff, 1.2);
  key.position.set(1, 4, 2); scene.add(key);
  const rim = new THREE.DirectionalLight(0x88aaff, 0.5);
  rim.position.set(-2, 1, -1); scene.add(rim);
}

function remapV(geo, vMin, vMax) {
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setY(i, vMin + uv.getY(i) * (vMax - vMin));
  uv.needsUpdate = true;
}

function setupVideoBackground() {
  videoEl = document.createElement('video');
  
  // VIGTIGT FIX: Vi sætter IKKE crossOrigin her! 
  // HLS.js skaber en 'blob:' URL. Quest's WebXR nægter at opdatere en 
  // blob-tekstur, hvis crossOrigin='anonymous' er slået til. Dette forårsager den frosne frame.
  
  videoEl.loop = true;
  videoEl.muted = true;
  videoEl.defaultMuted = true;
  videoEl.autoplay = true;
  videoEl.playsInline = true;
  videoEl.setAttribute('webkit-playsinline','');
  videoEl.setAttribute('playsinline','');

  // DOM HACK: Gør elementet ægte "synligt" for Quest for at forhindre auto-pause
  videoEl.style.position = 'fixed';
  videoEl.style.top = '0px';
  videoEl.style.left = '0px';
  videoEl.style.width = '2px';
  videoEl.style.height = '2px';
  videoEl.style.opacity = '1';  // Skal være over 0.01 for at Chromium tegner den
  videoEl.style.pointerEvents = 'none';
  videoEl.style.zIndex = '-9999';
  document.body.appendChild(videoEl);

  videoEl.addEventListener('playing', () => diag('video: PLAYING'));
  videoEl.addEventListener('error', () => diag('video error: '+(videoEl.error && videoEl.error.message || 'unknown')));

  if (window.Hls && Hls.isSupported()) {
    hlsInstance = new Hls({ 
      enableWorker: false, 
      lowLatencyMode: false, 
      backBufferLength: 30,
      maxBufferLength: 15, 
      fragLoadingMaxRetry: 6,
      fragLoadingRetryDelay: 1000
    });

    hlsInstance.attachMedia(videoEl);
    hlsInstance.on(Hls.Events.MEDIA_ATTACHED, () => {
      hlsInstance.loadSource(VIDEO_URL);
    });
    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
        videoEl.play().catch(()=>{});
    });

    hlsInstance.on(Hls.Events.ERROR, (_, data) => {
      if (data.fatal) {
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            networkErrorCount++;
            if (networkErrorCount <= 10) {
                diag(`hls: network error (${networkErrorCount}/10), retrying...`);
                setTimeout(() => hlsInstance.startLoad(), 1500);
            } else {
                diag('hls: FAILED. Check if baggrund_004.ts is uploaded!');
                hlsInstance.destroy();
            }
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            hlsInstance.recoverMediaError();
        } else {
            hlsInstance.destroy();
        }
      }
    });

  } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
    // Kun Apple/Safari behøver crossOrigin, fordi de ikke bruger hls.js (blob urls)
    videoEl.crossOrigin = 'anonymous'; 
    videoEl.src = VIDEO_URL;
  }

  videoTex = new THREE.VideoTexture(videoEl);
  videoTex.colorSpace = THREE.SRGBColorSpace;
  videoTex.minFilter = THREE.LinearFilter;
  videoTex.magFilter = THREE.LinearFilter;
  videoTex.generateMipmaps = false;

  const base = new THREE.SphereGeometry(80, 64, 32);
  base.scale(-1, 1, 1);

  const lGeo = base.clone();
  remapV(lGeo, 0.5, 1.0);
  leftMat = new THREE.MeshBasicMaterial({ map:videoTex, transparent:true, opacity:0, depthWrite:false, toneMapped:false });
  leftSphere = new THREE.Mesh(lGeo, leftMat);
  leftSphere.layers.set(1);
  leftSphere.renderOrder = -1;
  scene.add(leftSphere);

  const rGeo = base.clone();
  remapV(rGeo, 0.0, 0.5);
  rightMat = new THREE.MeshBasicMaterial({ map:videoTex, transparent:true, opacity:0, depthWrite:false, toneMapped:false });
  rightSphere = new THREE.Mesh(rGeo, rightMat);
  rightSphere.layers.set(2);
  rightSphere.renderOrder = -1;
  scene.add(rightSphere);
}

function setupOrb() {
  orbGroup = new THREE.Group();
  orbGroup.position.set(0, -0.1, -1.5);
  scene.add(orbGroup);

  orbMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.4, 64, 64),
    new THREE.MeshPhysicalMaterial({ color:0x88ccff, emissive:0x051025, roughness:0.05, metalness:0.1, transmission:0.85, transparent:true, ior:1.3, thickness:0.5, clearcoat:1.0, clearcoatRoughness:0.1 })
  );
  orbGroup.add(orbMesh);
  orbLight = new THREE.PointLight(0x64d2ff, 1.0, 4.0);
  orbGroup.add(orbLight);

  const canvas = document.createElement('canvas');
  canvas.width = 1024; canvas.height = 1024;
  uiCtx = canvas.getContext('2d');
  uiTex = new THREE.CanvasTexture(canvas);
  uiTex.minFilter = THREE.LinearFilter;

  uiMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(0.46, 0.46),
    new THREE.MeshBasicMaterial({ map:uiTex, transparent:true, depthTest:false, depthWrite:false, side:THREE.DoubleSide })
  );
  uiMesh.position.set(0, 0, 0.10);
  uiMesh.renderOrder = 1;
  orbGroup.add(uiMesh);

  updateUIText('Mavevejrtrækning', 'Gør dig klar...');
}

function wrapLines(ctx, text, maxW) {
  const out = [];
  for (const para of String(text).split('\n')) {
    if (!para) { out.push(''); continue; }
    const words = para.split(' ');
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; }
      else line = test;
    }
    if (line) out.push(line);
  }
  return out;
}
function fitText(ctx, text, maxW, maxH, weight, baseSize, minSize) {
  let s = baseSize;
  while (s >= minSize) {
    ctx.font = `${weight} ${s}px system-ui,-apple-system,"Segoe UI",sans-serif`;
    const lines = wrapLines(ctx, text, maxW);
    const lh = s * 1.25;
    if (lines.every(l => ctx.measureText(l).width <= maxW) && lines.length * lh <= maxH) return { lines, size:s, lh };
    s -= 4;
  }
  ctx.font = `${weight} ${minSize}px system-ui,sans-serif`;
  return { lines:wrapLines(ctx,text,maxW), size:minSize, lh:minSize*1.25 };
}
function updateUIText(title, instruction) {
  if (currentTitle === title && currentInstruction === instruction) return;
  currentTitle = title; currentInstruction = instruction;
  uiCtx.clearRect(0, 0, 1024, 1024);
  uiCtx.textAlign = 'center'; uiCtx.textBaseline = 'middle';
  const MAX_W = 720, MAX_H = 720, GAP = 30;
  let tData = null, iData = null, totalH = 0;
  if (title) { tData = fitText(uiCtx, title, MAX_W, instruction ? 240 : MAX_H, 'bold', 100, 44); totalH += tData.lines.length * tData.lh; }
  if (instruction) { const remH = title ? Math.max(120, MAX_H - totalH - GAP) : MAX_H; iData = fitText(uiCtx, instruction, MAX_W, remH, title ? '500' : 'bold', title ? 60 : 90, 28); if (title) totalH += GAP; totalH += iData.lines.length * iData.lh; }
  let y = 512 - totalH / 2;
  if (tData) { uiCtx.fillStyle = '#ffffff'; uiCtx.shadowColor = 'rgba(100,210,255,0.8)'; uiCtx.shadowBlur = 18; uiCtx.font = `bold ${tData.size}px system-ui,-apple-system,"Segoe UI",sans-serif`; tData.lines.forEach((l,k)=>uiCtx.fillText(l, 512, y + tData.lh/2 + k*tData.lh)); y += tData.lines.length * tData.lh + (iData ? GAP : 0); }
  if (iData) { uiCtx.shadowBlur = title ? 0 : 16; uiCtx.shadowColor = 'rgba(100,210,255,0.6)'; uiCtx.fillStyle = title ? 'rgba(255,255,255,0.95)' : '#ffffff'; uiCtx.font = `${title ? '500' : 'bold'} ${iData.size}px system-ui,-apple-system,"Segoe UI",sans-serif`; iData.lines.forEach((l,k)=>uiCtx.fillText(l, 512, y + iData.lh/2 + k*iData.lh)); }
  uiCtx.shadowBlur = 0;
  uiTex.needsUpdate = true;
}

function roundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w/2, h/2);
  ctx.beginPath(); ctx.moveTo(x+rr, y); ctx.arcTo(x+w, y, x+w, y+h, rr); ctx.arcTo(x+w, y+h, x, y+h, rr); ctx.arcTo(x, y+h, x, y, rr); ctx.arcTo(x, y, x+w, y, rr); ctx.closePath();
}
function setupClapHUD() {
  clapHUD = new THREE.Group();
  clapHUD.position.set(0, 0.45, -1.5);
  const c = document.createElement('canvas'); c.width = 1024; c.height = 220;
  const tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter;
  const mesh = new THREE.Mesh( new THREE.PlaneGeometry(0.7, 0.151), new THREE.MeshBasicMaterial({ map:tex, transparent:true, depthTest:false }) );
  mesh.renderOrder = 999;
  clapHUD.add(mesh);
  clapHUD.userData = { canvas:c, ctx:c.getContext('2d'), tex };
  clapHUD.visible = false;
  camera.add(clapHUD);
}
function drawClapHUD() {
  clapHUD.visible = state.clapStart > 0;
  if (!clapHUD.visible) return;
  const { ctx, tex } = clapHUD.userData;
  const W = 1024, H = 220, R = 110;
  ctx.clearRect(0, 0, W, H);
  ctx.shadowColor='rgba(14,165,233,0.22)'; ctx.shadowBlur=28; ctx.shadowOffsetY=10; ctx.fillStyle='rgba(255,255,255,0.92)'; roundRect(ctx, 12, 8, W-24, H-24, R); ctx.fill();
  ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0; ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=2; roundRect(ctx, 13, 9, W-26, H-26, R-1); ctx.stroke();
  const elapsed = Date.now() - state.clapStart;
  const prog    = Math.min(1, elapsed / CLAP_TIME);
  const remain  = Math.max(0, Math.ceil((CLAP_TIME - elapsed) / 1000));
  ctx.fillStyle='#0f172a'; ctx.font='800 52px -apple-system,"SF Pro Rounded","Segoe UI",Helvetica,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(`👏 Hold sammen i ${remain}s for at lukke`, W/2, 78);
  const bx=64, by=142, bw=W-128, bh=36, br=18; ctx.fillStyle='rgba(14,165,233,0.12)'; roundRect(ctx, bx, by, bw, bh, br); ctx.fill();
  if (prog > 0) { const g = ctx.createLinearGradient(bx, 0, bx+bw, 0); g.addColorStop(0, '#bae6fd'); g.addColorStop(1, '#0ea5e9'); ctx.fillStyle = g; roundRect(ctx, bx, by, Math.max(br*2, Math.round(bw*prog)), bh, br); ctx.fill(); }
  tex.needsUpdate = true;
}

function setupControllers() {
  for (let i = 0; i < 2; i++) {
    const c = renderer.xr.getController(i);
    scene.add(c);
    controllers.push(c);
  }
}
function checkClap() {
  if (controllers.length < 2) { state.clapStart = 0; return; }
  const c1 = controllers[0], c2 = controllers[1];
  if (c1.position.lengthSq() === 0 && c2.position.lengthSq() === 0) { state.clapStart = 0; return; }
  if (c1.position.distanceTo(c2.position) <= CLAP_DIST) {
    if (!state.clapStart) state.clapStart = Date.now();
    else if (Date.now() - state.clapStart >= CLAP_TIME) { state.clapStart = 0; endXR(); }
  } else state.clapStart = 0;
}

function setupAudio() {
  audioListener = new THREE.AudioListener();
  camera.add(audioListener);
  oceanSound = new THREE.Audio(audioListener);
  new THREE.AudioLoader().load(
    'https://actions.google.com/sounds/v1/water/waves_crashing_on_rock_beach.ogg',
    b => { oceanSound.setBuffer(b); oceanSound.setLoop(true); oceanSound.setVolume(0); diag('audio: buffer loaded'); }, undefined, e => diag('audio load err: '+(e && e.message || 'unknown'))
  );
}

async function startXR() {
  if (!navigator.xr) { alert('WebXR understøttes ikke i denne browser.'); return; }
  try {
    const ar = await navigator.xr.isSessionSupported('immersive-ar');
    const session = await navigator.xr.requestSession(ar ? 'immersive-ar' : 'immersive-vr', { optionalFeatures:['dom-overlay'], domOverlay:{ root:document.body } });
    document.getElementById('overlay').classList.add('webxr-hidden');
    renderer.xr.setReferenceSpaceType('local');
    renderer.xr.setSession(session);
    state.xrSession = session;
    state.layersConfigured = false;

    session.addEventListener('select', () => {
      if (audioListener.context.state === 'suspended') audioListener.context.resume();
      if (oceanSound && oceanSound.buffer && !oceanSound.isPlaying) oceanSound.play();
      if (videoEl && videoEl.paused) videoEl.play().catch(()=>{});
    });
    
    setTimeout(() => { if (videoEl && videoEl.paused) videoEl.play().catch(()=>{}); }, 800);

    state.isPlaying = true;
    state.elapsedTime = 0; state.clapStart = 0;
    state.clock.start();
    renderer.setAnimationLoop(render);
    session.addEventListener('end', endXR);
  } catch (e) { alert('Kunne ikke starte WebXR: ' + e.message); }
}
function endXR() {
  if (state.xrSession) state.xrSession.end();
  state.isPlaying = false;
  document.getElementById('overlay').classList.remove('webxr-hidden');
  if (oceanSound && oceanSound.isPlaying) oceanSound.pause();
  if (videoEl) videoEl.pause();
  renderer.setAnimationLoop(null);
  state.xrSession = null;
  setTimeout(() => location.reload(), 300);
}

function render() {
  if (!state.isPlaying) return;
  const dt = state.clock.getDelta();
  state.elapsedTime += dt;

  // Watchdog: Tving videoen i gang, hvis den dør i baggrunden
  if (videoEl && videoEl.paused && videoEl.readyState >= 2) {
      if (state.elapsedTime - state.lastVideoPlayAttempt > 1.0) {
          state.lastVideoPlayAttempt = state.elapsedTime;
          videoEl.play().catch(() => {});
      }
  }

  if (!state.layersConfigured && state.xrSession) {
    const xrCam = renderer.xr.getCamera();
    if (xrCam.cameras && xrCam.cameras.length >= 2) {
      xrCam.cameras[0].layers.enable(1); xrCam.cameras[1].layers.enable(2);
      state.layersConfigured = true;
    } else if (xrCam.cameras && xrCam.cameras.length === 1) {
      xrCam.cameras[0].layers.enable(1); state.layersConfigured = true;
    }
  }

  if (state.lastCameraPos.lengthSq() === 0 && camera.position.lengthSq() > 0) state.lastCameraPos.copy(camera.position);
  const dx = camera.position.x - state.lastCameraPos.x;
  const dz = camera.position.z - state.lastCameraPos.z;
  const speed = dt > 0 ? Math.sqrt(dx*dx + dz*dz) / dt : 0;
  state.timeSinceLastMove = speed > 0.25 ? 0 : state.timeSinceLastMove + dt;
  state.lastCameraPos.copy(camera.position);

  if (state.elapsedTime < INTRO_DURATION) handleIntroPhase();
  else if (state.elapsedTime < INTRO_DURATION + BREATHING_DURATION) handleBreathingPhase();
  else handleCompletionPhase();

  const moving = state.timeSinceLastMove < 10.0;
  const target = moving ? 0.0 : state.baseEnvOpacity;
  const fade = moving ? 4.0 : 0.5;
  state.currentEnvOpacity += (target - state.currentEnvOpacity) * fade * dt;
  if (leftMat)  leftMat.opacity  = state.currentEnvOpacity;
  if (rightMat) rightMat.opacity = state.currentEnvOpacity;
  if (oceanSound) oceanSound.setVolume(state.currentEnvOpacity);

  orbGroup.position.y = -0.1 + Math.sin(state.elapsedTime * 0.5) * 0.03;
  orbMesh.rotation.y += 0.1 * dt;
  orbMesh.rotation.z += 0.05 * dt;

  checkClap();
  drawClapHUD();
  renderer.render(scene, camera);
}

function handleIntroPhase() {
  state.phase = 'INTRO'; state.baseEnvOpacity = 0.0;
  let instr;
  if      (state.elapsedTime < 15) instr = "Læg venstre hånd på brystet,\nog højre hånd på maven.";
  else if (state.elapsedTime < 35) instr = "Mærk din naturlige vejrtrækning.\nMaven skal udvide sig, når du ånder ind.";
  else                             instr = "Vi trækker vejret sammen.\nInd i 4 sek, ud i 6 sek.";
  updateUIText('Mavevejrtrækning', instr);
  orbGroup.scale.lerp(new THREE.Vector3(2.4, 2.4, 2.4), 0.03);
  orbMesh.material.emissiveIntensity = THREE.MathUtils.lerp(orbMesh.material.emissiveIntensity, 0.3, 0.05);
  orbLight.intensity = THREE.MathUtils.lerp(orbLight.intensity, 1.0, 0.05);
}
function handleBreathingPhase() {
  state.phase = 'BREATHING';
  const t = state.elapsedTime - INTRO_DURATION;
  state.baseEnvOpacity = Math.min(t / 120.0, 1.0);
  const cycle = t % 10;
  if (cycle < 4.0) {
    updateUIText('', 'Træk vejret ind...');
    const ease = 1 - Math.pow(1 - cycle/4.0, 3);
    orbGroup.scale.setScalar(1.0 + ease);
    orbMesh.material.emissiveIntensity = 0.2 + ease;
    orbLight.intensity = 0.5 + ease * 2.0;
  } else {
    updateUIText('', 'Pust langsomt ud...');
    const ease = -(Math.cos(Math.PI * (cycle-4.0)/6.0) - 1) / 2;
    orbGroup.scale.setScalar(2.0 - ease);
    orbMesh.material.emissiveIntensity = 1.2 - ease;
    orbLight.intensity = 2.5 - ease * 2.0;
  }
}
function handleCompletionPhase() {
  state.phase = 'DONE'; state.baseEnvOpacity = 1.0;
  updateUIText('Færdig', "Sessionen er slut.\nNyd stilheden et øjeblik.");
  orbGroup.scale.lerp(new THREE.Vector3(1.5, 1.5, 1.5), 0.03);
  orbMesh.material.emissiveIntensity = THREE.MathUtils.lerp(orbMesh.material.emissiveIntensity, 0.2, 0.05);
  orbLight.intensity = THREE.MathUtils.lerp(orbLight.intensity, 0.8, 0.05);
}

function onResize() {
  if (!camera || !renderer) return;
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
}

init();
</script>
</body>
</html>
